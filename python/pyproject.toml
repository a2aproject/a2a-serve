[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "a2a-serve"
version = "0.0.0"
description = "Python bindings of the a2a-serve sandbox and of a2aacp, with an ADK agent for ACP coding agents."
requires-python = ">=3.10"
license = "Apache-2.0"

[project.optional-dependencies]
adk = ["google-adk>=2.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
a2a_serve = ["_lib/*"]
