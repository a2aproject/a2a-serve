# Keeps a release pull request up to date with the changes on main. Merging
# it tags the release, and GoReleaser attaches the binaries and opens the
# Homebrew formula pull request.
name: release-please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.A2A_BOT_PAT }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  goreleaser:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Setup
        uses: ./.github/actions/setup

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "v2.17.1"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          A2A_BOT_PAT: ${{ secrets.A2A_BOT_PAT }}

  # Publishes ghcr.io/a2aproject/a2a-serve-relay, which runs a relay on
  # Cloud Run or any container platform.
  relay-image:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Build and push
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/a2a-serve-relay
          TAG: ${{ needs.release-please.outputs.tag_name }}
          TOKEN: ${{ github.token }}
        run: |
          set -eu
          printf '%s' "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker run --privileged --rm tonistiigi/binfmt --install arm64
          docker buildx create --use
          docker buildx build --push --platform linux/amd64,linux/arm64 \
            --build-arg "VERSION=${TAG#v}" \
            -t "$IMAGE:$TAG" -t "$IMAGE:latest" \
            -f internal/relay/image/Dockerfile .
