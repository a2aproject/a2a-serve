name: Nightly

on:
  schedule:
    - cron: '0 2 * * *'  # 2 AM UTC daily

  workflow_dispatch:

permissions:
  contents: read

jobs:
  race:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Setup
      uses: ./.github/actions/setup
      with:
        cache-profile: race

    - name: Race Detector
      env:
        GORACE: atexit_sleep_ms=0
      run: go test -race -mod=readonly -v -count=1 -shuffle=on ./...

  # A run of the agentsrv package takes several seconds on a hosted runner,
  # so 100 runs exceed the 60m job timeout on one shard; run it across two
  # 50-count shards and split the remaining packages across two 100-count shards.
  test-loop:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [ agentsrv-1, agentsrv-2, 0, 1 ]
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Setup
      uses: ./.github/actions/setup
      with:
        cache-profile: default

    - name: Test Loop (${{ matrix.shard }})
      run: |
        case "${{ matrix.shard }}" in
          agentsrv-1|agentsrv-2)
            go test -mod=readonly -count=50 -shuffle=on -timeout=60m ./internal/agentsrv
            ;;
          0|1)
            mapfile -t pkgs < <(go list ./... | grep -v '^github.com/a2aproject/a2a-serve/internal/agentsrv$' | awk "NR % 2 == ${{ matrix.shard }}")
            go test -mod=readonly -count=100 -shuffle=on -timeout=60m "${pkgs[@]}"
            ;;
        esac

  # Runs the real opencode image, built from this commit, against a scripted
  # model (see CONTRIBUTING.md).
  harness-opencode:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Setup
      uses: ./.github/actions/setup
      with:
        cache-profile: e2e

    - name: Build the opencode image
      run: docker build -t a2a-harness-opencode:e2e internal/agentprofile/images/opencode

    - name: Harness E2E
      env:
        E2E_HARNESS: opencode
        E2E_HARNESS_IMAGE: a2a-harness-opencode:e2e
      run: go test -tags e2e -mod=readonly -v -count=1 -run '^TestHarness' ./e2e/...

  # Runs the real copilot image, built from this commit, against a scripted
  # model (see CONTRIBUTING.md).
  harness-copilot:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Setup
      uses: ./.github/actions/setup
      with:
        cache-profile: e2e

    - name: Build the copilot image
      run: docker build -t a2a-harness-copilot:e2e internal/agentprofile/images/copilot

    - name: Harness E2E
      env:
        E2E_HARNESS: copilot
        E2E_HARNESS_IMAGE: a2a-harness-copilot:e2e
      run: go test -tags e2e -mod=readonly -v -count=1 -run '^TestHarness' ./e2e/...

  # Runs the real agy image, built from this commit, against a scripted
  # model (see CONTRIBUTING.md).
  harness-agy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Setup
      uses: ./.github/actions/setup

    - name: Build the agy image
      run: docker build -t a2a-harness-agy:e2e internal/agentprofile/images/agy

    - name: Harness E2E
      env:
        E2E_HARNESS: agy
        E2E_HARNESS_IMAGE: a2a-harness-agy:e2e
      run: go test -tags e2e -mod=readonly -v -count=1 -run '^TestHarness' ./e2e/...

  # The bot's messages go to the real Bot API, while a fake plays the user
  # (see CONTRIBUTING.md).
  telegram:
    if: github.repository == 'a2aproject/a2a-serve'
    runs-on: ubuntu-latest
    concurrency:
      group: telegram-live
    env:
      E2E_TELEGRAM_BOT_TOKEN: ${{ secrets.E2E_TELEGRAM_BOT_TOKEN }}
      E2E_TELEGRAM_CHAT_ID: ${{ secrets.E2E_TELEGRAM_CHAT_ID }}
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Setup
      uses: ./.github/actions/setup
      with:
        cache-profile: e2e

    - name: Check secrets
      run: |
        if [ -z "$E2E_TELEGRAM_BOT_TOKEN" ] || [ -z "$E2E_TELEGRAM_CHAT_ID" ]; then
          echo "::error::set the E2E_TELEGRAM_BOT_TOKEN and E2E_TELEGRAM_CHAT_ID secrets"
          exit 1
        fi

    - name: Telegram E2E
      run: go test -tags e2e -mod=readonly -v -count=1 -run '^TestTelegramLive$' ./e2e/...
