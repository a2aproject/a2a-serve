name: Nightly

on:
  schedule:
    - cron: '0 2 * * *'  # 2 AM UTC daily

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Setup
      uses: ./.github/actions/setup

    - name: Race Detector
      run: go test -race -mod=readonly -v -count=1 -shuffle=on ./...

    # A run of the agentsrv package takes several seconds on a hosted runner,
    # so 200 runs need more than the default 10m timeout.
    - name: Test Loop
      run: go test -mod=readonly -count=200 -shuffle=on -timeout=60m ./...

  # Runs the real opencode image, built from this commit, against a scripted
  # model (see CONTRIBUTING.md).
  harness-opencode:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Setup
      uses: ./.github/actions/setup

    - name: Build the opencode image
      run: docker build -t a2a-harness-opencode:e2e internal/harness/images/opencode

    - name: Harness E2E
      env:
        E2E_HARNESS: opencode
        E2E_HARNESS_IMAGE: a2a-harness-opencode:e2e
      run: go test -tags e2e -mod=readonly -v -count=1 -run '^TestHarness' ./e2e/...

  # The bot's messages go to the real Bot API, while a fake plays the user
  # (see CONTRIBUTING.md).
  telegram:
    if: github.repository == 'a2aproject/a2a-serve'
    runs-on: ubuntu-latest
    concurrency:
      group: telegram-live
    env:
      E2E_TELEGRAM_BOT_TOKEN: ${{ secrets.E2E_TELEGRAM_BOT_TOKEN }}
      E2E_TELEGRAM_CHAT_ID: ${{ secrets.E2E_TELEGRAM_CHAT_ID }}
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Setup
      uses: ./.github/actions/setup

    - name: Check secrets
      run: |
        if [ -z "$E2E_TELEGRAM_BOT_TOKEN" ] || [ -z "$E2E_TELEGRAM_CHAT_ID" ]; then
          echo "::error::set the E2E_TELEGRAM_BOT_TOKEN and E2E_TELEGRAM_CHAT_ID secrets"
          exit 1
        fi

    - name: Telegram E2E
      run: go test -tags e2e -mod=readonly -v -count=1 -run '^TestTelegramLive$' ./e2e/...
