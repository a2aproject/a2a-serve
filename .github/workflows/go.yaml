# This workflow will build a golang project
# For more information see: 
# - https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go
# - https://golangci-lint.run/usage/configuration/

name: Go

on:
  push:
    branches: [ "main", "release/**" ]

  pull_request:
    branches: [ "main", "release/**" ]

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Setup
      uses: ./.github/actions/setup

    # Tidy also fetches test dependencies of dependencies; retry download errors, fail on a diff.
    - name: Tidy
      run: |
        for attempt in 1 2 3; do
          if diff=$(go mod tidy -diff); then exit 0; fi
          if [ -n "$diff" ]; then echo "$diff"; exit 1; fi
          echo "::warning::go mod tidy failed (attempt $attempt)"
          sleep $((attempt * 15))
        done
        exit 1

    - name: Build
      run: go build -mod=readonly -v ./...

    - name: Test
      run: go test -mod=readonly -count=10 -shuffle=on ./...

    # Agent Mesh support builds only with -tags agentmesh.
    - name: Test agentmesh
      run: |
        go vet -mod=readonly -tags agentmesh ./...
        go test -race -mod=readonly -count=1 -shuffle=on -tags agentmesh ./internal/network/ ./internal/relay/

  race:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Setup
      uses: ./.github/actions/setup

    - name: Test Race
      run: go test -race -mod=readonly -v -count=1 -shuffle=on ./...

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Setup
      uses: ./.github/actions/setup

    - name: Lint
      uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9.2.0
      with:
        install-mode: goinstall
        version: 8f3b0c7ed018e57905fbd873c697e0b1ede605a5 # v2.11.4
