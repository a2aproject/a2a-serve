# Builds release binaries for a pushed v* tag and attaches them to a GitHub
# release of the tag.
name: Release

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Setup
      uses: ./.github/actions/setup

    - name: Build
      env:
        VERSION: ${{ github.ref_name }}
      run: |
        set -eu
        date=$(git log -1 --format=%cI)
        pkg=github.com/a2aproject/a2a-serve/internal/cli
        ldflags="-s -w -X $pkg.version=$VERSION -X $pkg.commit=$GITHUB_SHA -X $pkg.date=$date"
        mkdir dist
        for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
          os=${target%/*} arch=${target#*/}
          name=a2a-serve_${VERSION#v}_${os}_${arch}
          mkdir "dist/$name"
          CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "$ldflags" -o "dist/$name/a2a-serve" .
          cp LICENSE README.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
        done
        (cd dist && sha256sum ./*.tar.gz > checksums.txt)

    - name: Publish
      env:
        GH_TOKEN: ${{ github.token }}
        VERSION: ${{ github.ref_name }}
      run: |
        prerelease=""
        case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
        gh release create "$VERSION" --verify-tag --generate-notes $prerelease dist/*.tar.gz dist/checksums.txt
