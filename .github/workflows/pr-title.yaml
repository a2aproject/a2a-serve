name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  conventional-commits:
    runs-on: ubuntu-latest
    steps:
    - name: Check the title follows Conventional Commits
      env:
        TITLE: ${{ github.event.pull_request.title }}
      run: |
        pattern='^(feat|fix|docs|refactor|test|chore|ci|build|perf|style|revert)(\([a-z0-9/_-]+\))?!?: .+'
        if ! printf '%s' "$TITLE" | grep -Eq "$pattern"; then
          echo "::error::PR title \"$TITLE\" doesn't follow Conventional Commits, for example \"fix(router): keep messages in order\"."
          exit 1
        fi
