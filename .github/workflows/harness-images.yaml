# Publishes the harness images that `a2a-serve start <harness>` pulls by default,
# ghcr.io/a2aproject/harness-<name>:latest. Without them every first run builds
# the image locally. Images with publish: false are only built and checked;
# the agentprofile tests keep this list in line with the profiles.
name: Harness images

on:
  push:
    branches: [ "main" ]
    paths:
      - 'internal/agentprofile/images/**'
      - '.github/workflows/harness-images.yaml'
  pull_request:
    paths:
      - 'internal/agentprofile/images/**'
      - '.github/workflows/harness-images.yaml'
  schedule:
    # Weekly, to pick up new harness and a2a CLI releases installed at build time.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - harness: opencode
            publish: true
          # Built on each machine: whoever preinstalls Claude Code has to
          # accept Anthropic's Commercial Terms.
          - harness: claude
            publish: false
          # Built on each machine; the project doesn't publish a Copilot image.
          - harness: copilot
            publish: false
          # Built on each machine; the project doesn't publish an Antigravity
          # image.
          - harness: agy
            publish: false
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Build
      if: github.event_name == 'pull_request' || !matrix.publish
      run: docker build -t harness internal/agentprofile/images/${{ matrix.harness }}

    - name: Check git reads reftable repositories
      if: github.event_name == 'pull_request' || !matrix.publish
      run: |
        docker run --rm harness sh -euc '
          git --version
          git init -q --ref-format=reftable /tmp/r
          git -C /tmp/r status'

    - name: Build and push
      if: github.event_name != 'pull_request' && matrix.publish
      env:
        IMAGE: ghcr.io/${{ github.repository_owner }}/harness-${{ matrix.harness }}
        CONTEXT: internal/agentprofile/images/${{ matrix.harness }}
        TOKEN: ${{ github.token }}
      run: |
        set -eu
        printf '%s' "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        docker run --privileged --rm tonistiigi/binfmt --install arm64
        docker buildx create --use
        docker buildx build --push --platform linux/amd64,linux/arm64 \
          -t "$IMAGE:latest" -t "$IMAGE:sha-${GITHUB_SHA::12}" \
          "$CONTEXT"
