# Publishes the harness images that `a2a serve <harness>` pulls by default,
# ghcr.io/a2aproject/harness-<name>:a2a-<A2A_CLI_VERSION of the Dockerfile>.
# Without them every first run builds the image locally.
name: Harness images

on:
  push:
    branches: [ "main" ]
  schedule:
    # Weekly, to pick up new harness releases installed at build time.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        harness: [ opencode, claude ]
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Build and push
      env:
        IMAGE: ghcr.io/${{ github.repository_owner }}/harness-${{ matrix.harness }}
        CONTEXT: internal/harness/images/${{ matrix.harness }}
        TOKEN: ${{ github.token }}
      run: |
        set -eu
        cli=$(sed -n 's/^ARG A2A_CLI_VERSION=//p' "$CONTEXT/Dockerfile")
        test -n "$cli"
        printf '%s' "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        docker run --privileged --rm tonistiigi/binfmt --install arm64
        docker buildx create --use
        docker buildx build --push --platform linux/amd64,linux/arm64 \
          -t "$IMAGE:a2a-$cli" -t "$IMAGE:latest" -t "$IMAGE:sha-${GITHUB_SHA::12}" \
          "$CONTEXT"
