# GoReleaser configuration for a2a-serve.
# Docs: https://goreleaser.com
#
# Releases are cut by release-please, which creates the git tag and the GitHub
# Release (with the changelog). This config cross-compiles the binary,
# uploads the archives and checksums to that release, and opens pull requests
# for the Homebrew formula.
version: 2

project_name: a2a-serve

before:
  hooks:
    - go mod download
    - sh -c "cd providers/agentmesh && go mod download"

builds:
  - id: a2a-serve
    main: .
    binary: a2a-serve
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/a2aproject/a2a-serve/internal/cli.version={{ .Version }}
      - -X github.com/a2aproject/a2a-serve/internal/cli.commit={{ .FullCommit }}
      - -X github.com/a2aproject/a2a-serve/internal/cli.date={{ .Date }}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

  # The Agent Mesh network provider ships in the archive next to a2a-serve,
  # which runs it to join relays. It is its own module, so the core go.mod
  # has no Agent Mesh dependencies.
  - id: netprovider-agentmesh
    dir: providers/agentmesh
    main: .
    binary: netprovider-agentmesh
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - id: a2a-serve
    ids:
      - a2a-serve
      - netprovider-agentmesh
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    formats:
      - tar.gz
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

# The formula lives next to the a2a CLI's, in the a2aproject/a2a-cli tap,
# so `brew install a2aproject/a2a-cli/a2a-serve` brings both. The repository
# isn't named homebrew-a2a-cli, so users tap it by URL first.
brews:
  - name: a2a-serve
    ids:
      - a2a-serve
    homepage: "https://github.com/a2aproject/a2a-serve"
    description: "Serve a coding agent over A2A from its project directory."
    license: "Apache-2.0"
    directory: Formula
    skip_upload: "auto"
    dependencies:
      - name: a2aproject/a2a-cli/a2a
    commit_msg_template: "release: update Homebrew formula for a2a-serve {{ .Tag }}"
    install: |
      bin.install "a2a-serve"
      (libexec/"a2a-serve").install "netprovider-agentmesh"
    caveats: |
      Enable the a2a CLI plugin and credential helper, and check Docker:
        a2a-serve doctor --fix
      Then set up an agent in a project directory:
        cd ~/src/app && a2a-serve start
    test: |
      system "#{bin}/a2a-serve", "version"
    repository:
      owner: a2aproject
      name: a2a-cli
      branch: "homebrew/a2a-serve-{{ .Version }}"
      token: "{{ .Env.A2A_BOT_PAT }}"
      pull_request:
        enabled: true

snapshot:
  version_template: "{{ incpatch .Version }}-next"

# release-please owns the release notes.
changelog:
  disable: true

release:
  # Only attach binaries to the release release-please created.
  mode: keep-existing
