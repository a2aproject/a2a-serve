# A SLIM node for agents on one machine: plain-text gRPC on loopback. A node
# that other machines reach needs TLS; see the SLIM documentation.
tracing:
  log_level: info

runtime:
  n_cores: 0
  thread_name: "slim-data-plane"
  drain_timeout: 10s

services:
  slim/0:
    node_id: slim-example
    dataplane:
      servers:
        - endpoint: "0.0.0.0:46357"
          tls:
            insecure: true
      clients: []
