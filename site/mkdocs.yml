site_name: A2A Serve
site_description: One command turns the coding agent on your machine into a sandboxed A2A agent that people, scripts and other agents can call.
site_url: https://a2aproject.github.io/a2a-serve/
repo_url: https://github.com/a2aproject/a2a-serve
repo_name: a2aproject/a2a-serve
edit_uri: ""
docs_dir: .build/docs
site_dir: .out/site
copyright: Copyright 2026 The A2A Authors

validation:
  links:
    anchors: warn
    unrecognized_links: warn

theme:
  name: material
  custom_dir: overrides
  logo: assets/a2a_icon_color.svg
  favicon: assets/a2a_icon_color.svg
  features:
    - navigation.top
    - navigation.footer
    - search.suggest
    - content.code.copy
    - toc.integrate
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Dark mode
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github

hooks:
  - hooks.py

extra_css:
  - css/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 2
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - github-callouts

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - User Guide:
      - Supported Agents: guide/supported-agents.md
      - Running: guide/running.md
      - Config: guide/config.md
      - Secrets: guide/secrets.md
      - Sandbox: guide/sandbox.md
      - MCP and Skills: guide/mcp-and-skills.md
      - Recipes: guide/recipes.md
      - Approvals: guide/approvals.md
      - Inspector: guide/inspector.md
      - Identities: guide/identities.md
      - Email Sign-In: guide/email-sign-in.md
      - Networks: guide/networks.md
      - Relays: guide/relays.md
      - Messengers: guide/messengers.md
      - Agent2Agent: guide/agent2agent.md
      - Schedules: guide/schedules.md
      - Webhook Nodes: guide/webhook-nodes.md
      - Backups: guide/backups.md
      - Shell Completion: guide/shell-completion.md
  - Examples:
      - Serve a Coding Agent: examples/01-agent-server/index.md
      - Tailscale, Telegram and Grok: examples/02-tailscale-telegram-grok/index.md
      - Agent Mesh Relay: examples/03-agentmesh-relay/index.md
      - Observability Agent: examples/04-observability-agent/index.md
      - Relay on Cloud Run: examples/05-relay-cloud-run/index.md
  - Advanced:
      - Architecture: advanced/architecture.md
      - Agent Directory: advanced/agent-directory.md
      - Access Model: advanced/access-model.md
      - Agent Mesh: advanced/agent-mesh.md
      - Security: advanced/security.md
  - Reference:
      - Commands:
          - a2a-serve: reference/commands/a2a-serve.md
          - start: reference/commands/start.md
          - status: reference/commands/status.md
          - logs: reference/commands/logs.md
          - stop: reference/commands/stop.md
          - restart: reference/commands/restart.md
          - inspect: reference/commands/inspect.md
          - config: reference/commands/config.md
          - recipe: reference/commands/recipe.md
          - channel: reference/commands/channel.md
          - schedule: reference/commands/schedule.md
          - backup: reference/commands/backup.md
          - pair: reference/commands/pair.md
          - contact: reference/commands/contact.md
          - peers: reference/commands/peers.md
          - mailbox: reference/commands/mailbox.md
          - relay: reference/commands/relay.md
          - doctor: reference/commands/doctor.md
          - completion: reference/commands/completion.md
          - version: reference/commands/version.md
      - Configuration File: reference/configuration.md
      - Output and Exit Codes: reference/output.md
      - HTTP Routes: reference/http-routes.md
      - The a2a CLI: reference/a2a-cli.md
